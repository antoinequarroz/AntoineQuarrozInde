name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production delivery halfway through. Pull requests can
  # still discard obsolete runs when a newer commit is pushed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: bash -n scripts/ops/*.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run quality:budgets

  accessibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_ANON_KEY: local-accessibility-placeholder
      SUPABASE_PUBLISHABLE_KEY: local-accessibility-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/accessibility.spec.ts --project=chromium

  seo-quality:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: 127.0.0.1
      PORT: 3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the candidate and capture its laboratory baseline
        run: |
          node .output/server/index.mjs > "$RUNNER_TEMP/seo-preview.log" 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent --max-time 2 http://127.0.0.1:3100/ >/dev/null && break
            if [[ "$attempt" == 60 ]]; then cat "$RUNNER_TEMP/seo-preview.log"; exit 1; fi
            sleep 1
          done
          # Data-backed scenarios run after deployment against the real isolated
          # E2E account. The candidate gate stays hermetic and receives no
          # production database credential.
          E2E_BASE_URL=http://127.0.0.1:3100 npm run test:e2e -- e2e/public.spec.ts --project=chromium --grep-invert @live-data
          npm run quality:seo:lab -- http://127.0.0.1:3100
      - name: Preserve candidate SEO baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-lab-${{ github.sha }}
          path: .artifacts/seo-quality/lab.json
          if-no-files-found: warn
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:db

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, database, seo-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://www.antoinequarroz.ch
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install encrypted backup tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Promote verified Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_BACKUP_AGE_RECIPIENT: ${{ secrets.SUPABASE_BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_BACKUP_AGE_RECIPIENT"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$SUPABASE_BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]{20,}$ ]]
          bash scripts/ops/promote-supabase-migrations.sh "$RUNNER_TEMP/aq060-migration-artifacts"
      - name: Preserve encrypted pre-migration recovery artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-pre-migration-${{ github.sha }}
          path: ${{ runner.temp }}/aq060-migration-artifacts/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Deploy the exact main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PROJECT_DIR"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PROJECT_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/vps_deploy_key"
          trap 'rm -f "$RUNNER_TEMP/vps_deploy_key"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh \
            -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$EXPECTED_SHA' '$VPS_PROJECT_DIR'"
      - name: Verify the public release
        run: bash scripts/ops/verify-production-release.sh "$EXPECTED_SHA" https://www.antoinequarroz.ch
      - name: Verify the canonical public domain
        run: bash scripts/ops/verify-domain-canonicalization.sh https://antoinequarroz.ch https://www.antoinequarroz.ch
      - name: Verify public security headers
        run: bash scripts/ops/verify-security-headers.sh https://www.antoinequarroz.ch
      - name: Verify private routes are non-indexable
        run: bash scripts/ops/verify-private-noindex.sh https://www.antoinequarroz.ch
      - name: Verify the OpenAI crawler policy
        run: bash scripts/ops/verify-openai-robots-policy.sh https://www.antoinequarroz.ch
      - name: Verify localized home and legal pages
        run: bash scripts/ops/verify-localized-pages.sh https://www.antoinequarroz.ch
      - name: Verify French-only route policy
        run: bash scripts/ops/verify-french-only-routes.sh https://www.antoinequarroz.ch
      - name: Verify sitemap discovery
        run: bash scripts/ops/verify-sitemap-discovery.sh https://www.antoinequarroz.ch
      - name: Verify server-rendered blog discovery
        run: bash scripts/ops/verify-blog-ssr.sh https://www.antoinequarroz.ch
      - name: Verify public identity and social previews
        run: bash scripts/ops/verify-identity-social.sh https://www.antoinequarroz.ch
      - name: Verify article attribution and BlogPosting data
        run: bash scripts/ops/verify-blog-posting.sh https://www.antoinequarroz.ch
      - name: Verify service and breadcrumb structured data
        run: bash scripts/ops/verify-service-breadcrumbs.sh https://www.antoinequarroz.ch
      - name: Verify service decision content
        run: bash scripts/ops/verify-service-decision-content.sh https://www.antoinequarroz.ch
      - name: Verify approved case studies
        run: bash scripts/ops/verify-approved-case-studies.sh https://www.antoinequarroz.ch
      - name: Collect Core Web Vitals field evidence when available
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: npm run quality:seo:field -- https://www.antoinequarroz.ch
      - name: Preserve SEO quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-quality-${{ github.sha }}
          path: .artifacts/seo-quality/*.json
          if-no-files-found: warn
          retention-days: 30

  e2e:
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || needs.deploy.result == 'success')
    needs: [quality, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://www.antoinequarroz.ch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Capture the deployed laboratory baseline
        run: |
          for attempt in 1 2 3; do
            if npm run quality:seo:lab -- "$E2E_BASE_URL"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Production lab sample $attempt failed; retrying to rule out transient network variance."
          done
      - name: Verify credentials and run E2E
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
        run: |
          test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve deployed SEO baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-lab-production-${{ github.sha }}
          path: .artifacts/seo-quality/lab.json
          if-no-files-found: warn
          retention-days: 30
