name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production delivery halfway through. Pull requests can
  # still discard obsolete runs when a newer commit is pushed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: bash -n scripts/ops/*.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run quality:budgets

  accessibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_ANON_KEY: local-accessibility-placeholder
      SUPABASE_PUBLISHABLE_KEY: local-accessibility-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/accessibility.spec.ts --project=chromium

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:db

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://www.antoinequarroz.ch
    env:
      EXPECTED_SHA: ${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_BACKUP_AGE_RECIPIENT: ${{ secrets.SUPABASE_BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install encrypted backup tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Verify deployment secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PROJECT_DIR"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_BACKUP_AGE_RECIPIENT"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PROJECT_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$SUPABASE_BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]{20,}$ ]]
      - name: Promote verified Supabase migrations
        run: bash scripts/ops/promote-supabase-migrations.sh "$RUNNER_TEMP/aq060-migration-artifacts"
      - name: Preserve encrypted pre-migration recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-pre-migration-${{ github.sha }}
          path: ${{ runner.temp }}/aq060-migration-artifacts/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Configure dedicated SSH identity
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/vps_deploy_key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy the exact main commit
        run: |
          ssh \
            -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$EXPECTED_SHA' '$VPS_PROJECT_DIR'"
      - name: Verify the public release
        run: bash scripts/ops/verify-production-release.sh "$EXPECTED_SHA" https://www.antoinequarroz.ch
      - name: Verify the canonical public domain
        run: bash scripts/ops/verify-domain-canonicalization.sh https://antoinequarroz.ch https://www.antoinequarroz.ch
      - name: Verify private routes are non-indexable
        run: bash scripts/ops/verify-private-noindex.sh https://www.antoinequarroz.ch
      - name: Verify the OpenAI crawler policy
        run: bash scripts/ops/verify-openai-robots-policy.sh https://www.antoinequarroz.ch
      - name: Verify localized home and legal pages
        run: bash scripts/ops/verify-localized-pages.sh https://www.antoinequarroz.ch
      - name: Verify French-only route policy
        run: bash scripts/ops/verify-french-only-routes.sh https://www.antoinequarroz.ch
      - name: Verify sitemap discovery
        run: bash scripts/ops/verify-sitemap-discovery.sh https://www.antoinequarroz.ch
      - name: Verify server-rendered blog discovery
        run: bash scripts/ops/verify-blog-ssr.sh https://www.antoinequarroz.ch
      - name: Verify public identity and social previews
        run: bash scripts/ops/verify-identity-social.sh https://www.antoinequarroz.ch
      - name: Verify article attribution and BlogPosting data
        run: bash scripts/ops/verify-blog-posting.sh https://www.antoinequarroz.ch
      - name: Verify service and breadcrumb structured data
        run: bash scripts/ops/verify-service-breadcrumbs.sh https://www.antoinequarroz.ch
      - name: Verify service decision content
        run: bash scripts/ops/verify-service-decision-content.sh https://www.antoinequarroz.ch
      - name: Verify approved case studies
        run: bash scripts/ops/verify-approved-case-studies.sh https://www.antoinequarroz.ch

  e2e:
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || needs.deploy.result == 'success')
    needs: [quality, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://www.antoinequarroz.ch
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Verify E2E secrets
        run: test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
