name: Storybook
on:
  pull_request:
    paths: ['.storybook/**', 'stories/**', 'app/components/**', 'app/composables/**', 'app/utils/**', 'app/assets/css/**', 'shared/**', 'i18n/**', 'scripts/check-storybook-coverage.mjs', 'tailwind.config.ts', 'package.json', 'package-lock.json', '.github/workflows/storybook.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/check-storybook-coverage.mjs
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: aq-storybook
          path: storybook-static
          retention-days: 7
