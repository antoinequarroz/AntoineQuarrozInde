<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0a0b18">
    <title>Connexion interrompue — Antoine Quarroz</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0b18;color:#f5f3ff}
      *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#291348,transparent 65%),#0a0b18}
      main{max-width:440px;padding:36px;border:1px solid #45325e;border-radius:24px;background:#12111de6}
      .brand{font-size:14px;font-weight:650;color:#c4a2fa;letter-spacing:.02em;margin:0 0 36px}
      h1{font-size:clamp(28px,6vw,38px);line-height:1.15;letter-spacing:-.035em;margin:0 0 20px}
      p{line-height:1.65;color:#cbc4d8;margin:0 0 24px}a{display:inline-flex;align-items:center;min-height:48px;padding:12px 20px;border-radius:14px;background:#7c3aed;color:white;font-weight:650;text-decoration:none}
      a:hover{background:#8b5cf6}a:focus-visible{outline:3px solid #ddd6fe;outline-offset:5px}
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Antoine Quarroz</p>
      <h1>La connexion est interrompue.</h1>
      <p>Cette page a besoin d’une connexion Internet. Dès qu’elle revient, vous pouvez retrouver mes projets et me parler de votre idée.</p>
      <a href="/">Revenir à l’accueil</a>
    </main>
  </body>
</html>
